<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Reject All Cookies</h1>
    <label class="row">
      <span>Enabled everywhere</span>
      <input type="checkbox" id="global-toggle" />
    </label>
    <label class="row">
      <span id="site-label">Enabled on this site</span>
      <input type="checkbox" id="site-toggle" />
    </label>
    <div class="stat">Banners handled on this page: <span id="count">0</span></div>
    <script src="popup.js"></script>
  </body>
</html>
